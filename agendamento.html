<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>⚽ → Arena Sports</h1>
        <nav>
            <a href="index.html">Início</a> |
            <a href="modalidades.html">Modalidades e preços</a> |
            <a href="agendamento.html">Agende sua quadra</a> |
            <a href="sobrenos.html">Sobre nós</a> |
            <a href="contato.html">Contato</a> |
        </nav>
        
    </header>
    <br>
    <form action="#" method="post">
            <label for="nome">Nome Completo</label>
            <input type="text" name="nome" id="nome" required>
            <br>

            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br>

            <label for="telefone">Telefone:</label>
            <input 
                type="tel" 
                name="telefone" 
                id="telefone" 
                required
                inputmode="numeric"
                maxlength="15"
                pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                title="Digite com o DDD.Ex (17) 99674-2630 ou 17996742630"
                >
            <br>
            <label for="data">Data:</label>
            <input type="date" name="data" id="data" required>
            <br>

            <label for="hora">Hora:</label>
            <input type="time" name="hora" id="hora" required>
            <br>

            <label for="modalidades">Modalidades</label>
            <select name="modalidades" id="modalidades" required>
                <option value="">Selecione uma opção</option>
                <option value="clinico-geral">Futebol society</option>
                <option value="cardiologia">Volei</option>
                <option value="dermatologia">Beach Tennis</option>
                <option value="pediatria">Futvolei</option>
            </select>
            <br>
            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="mensagem" rows="4"></textarea>
            <br>
            <button type="submit">Confirmar agendamento de quadra</button>

        </form>

    <footer>

        📧 contato@arenasports.com</p> <br>

    </footer>

</body>
</html>
